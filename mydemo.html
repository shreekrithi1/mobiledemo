<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>MobileHeal · Private demo</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#d0d7e2;--acc:#1a73e8;--err:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#11161d;--ink:#e6edf3;--mute:#9aa4b2;--line:#2b323c;--acc:#4f8cff;--err:#f87171}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{min-height:100%;display:grid;place-items:center;padding:16px}
.c{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px 28px;text-align:center;box-shadow:0 20px 50px -30px #0008}
.lg{width:48px;height:48px;border-radius:13px;margin:0 auto 14px;background:linear-gradient(135deg,#1a73e8,#14b8a6);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px}
h1{font-size:20px;margin:0 0 6px}p{margin:0 0 22px;color:var(--mute);font-size:14px;line-height:1.5}
input{width:100%;font:600 26px/1 ui-monospace,Menlo,monospace;letter-spacing:.5em;text-align:center;padding:14px 0 14px .5em;border:1.5px solid var(--line);border-radius:12px;background:transparent;color:var(--ink)}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 20%,transparent)}
button{margin-top:14px;width:100%;min-height:46px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:600 15px Inter,system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.e{min-height:20px;margin-top:12px;color:var(--err);font-size:13px}.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style></head><body><main class="w"><form class="c" id="f" autocomplete="off">

<input id="pin" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="12" required autofocus>
<button id="go" type="submit">Unlock</button><div class="e" id="e" role="alert" aria-live="polite"></div></form></main>
