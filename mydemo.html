<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MobileHeal · Product demo</title>
<style>
:root{--ink:#0f172a;--ink2:#334155;--mute:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;--blue:#1a73e8;--green:#16a34a;--red:#dc2626;--amber:#d97706;--violet:#7c3aed;--teal:#0d9488}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Google Sans","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100vh}
/* left navigation */
.nav{background:#0b1220;color:#cbd5e1;display:flex;flex-direction:column;min-height:0;height:100vh;position:sticky;top:0;overflow:hidden}
#chapters{flex:1;min-height:0;overflow-y:auto;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:#334155 transparent}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 14px}
.brand .lg{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#1a73e8,#14b8a6);display:grid;place-items:center;color:#fff;font-weight:800}
.brand b{color:#fff;font-size:15px;display:block}.brand small{font-size:11px;color:#94a3b8}
.navlbl{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:#64748b;padding:12px 20px 6px}
.chap{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;margin:2px 10px;border-radius:12px;cursor:pointer;border:0;background:transparent;color:inherit;text-align:left;font:inherit;width:calc(100% - 20px)}
.chap:hover{background:#ffffff0d}
.chap{position:relative;color:#cbd5e1}.chap b{color:#e2e8f0}
.chap.on{background:#1e3a5f;color:#fff;box-shadow:inset 3px 0 0 #38bdf8}.chap.on b{color:#fff}.chap.on small{color:#bae6fd}
.chap:focus-visible{outline:2px solid #38bdf8;outline-offset:2px}
.chap .n{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.chap b{display:block;font-size:13px;line-height:1.35;font-weight:600}
.chap small{display:block;font-size:11px;color:#94a3b8;margin-top:2px}
.chap .pb{height:3px;border-radius:3px;background:#ffffff14;margin-top:7px;overflow:hidden}.chap .pb i{display:block;height:100%;width:0;background:#38bdf8}
.navfoot{margin-top:auto;padding:14px 20px;font-size:11px;color:#64748b;border-top:1px solid #ffffff10}
.navfoot label{display:flex;align-items:center;gap:8px;cursor:pointer;color:#94a3b8}
/* main */
.main{overflow:auto;padding:22px 28px 28px;min-width:0}
.top{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.top h1{margin:0;font-size:24px;letter-spacing:-.4px}.top p{margin:4px 0 0;color:var(--mute);font-size:13.5px;max-width:760px}
.top .eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700}
.slide{border-radius:24px;padding:22px;box-shadow:0 20px 50px -24px #0f172a55;position:relative;overflow:hidden}
.slide:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% -10%,#ffffff22,transparent 50%);pointer-events:none}
.video{position:relative;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 10px 30px -12px #0f172a66;aspect-ratio:16/9;max-height:calc(100vh - 290px);margin:0 auto;container-type:inline-size}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;font-size:clamp(9px,1.25cqw,14px)}
.titles{border-radius:0 0 18px 18px;margin-top:-1px;color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;min-height:78px}
.titles .tk{flex:none;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;font-weight:800;background:#ffffff26;border-radius:6px;padding:5px 8px}
.titles b{display:block;font-size:17px;letter-spacing:-.2px;line-height:1.3}
.titles span{display:block;font-size:13px;opacity:.9;margin-top:2px;line-height:1.45}
.titles .cap{animation:capin .45s ease both}
@keyframes capin{from{opacity:0;transform:translateY(6px)}}
.ctrl{display:flex;align-items:center;gap:12px;margin-top:14px;color:#fff}
.ctrl button{border:0;background:#ffffff26;color:#fff;border-radius:10px;height:36px;min-width:36px;padding:0 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.ctrl button:hover{background:#ffffff3a}
.ctrl .play{background:#fff;color:#0f172a;min-width:44px}
.scrub{flex:1;position:relative;height:28px;cursor:pointer}
.scrub .tr{position:absolute;left:0;right:0;top:12px;height:5px;border-radius:5px;background:#ffffff40}
.scrub .fl{position:absolute;left:0;top:12px;height:5px;border-radius:5px;background:#fff}
.scrub .mk{position:absolute;top:9px;width:3px;height:11px;border-radius:2px;background:#ffffffaa}
.scrub .kn{position:absolute;top:6px;width:16px;height:16px;border-radius:50%;background:#fff;margin-left:-8px;box-shadow:0 2px 6px #0004}
.time{font-variant-numeric:tabular-nums;font-size:12.5px;opacity:.9;min-width:86px;text-align:right}
/* inside the video: product chrome */
.vbar{display:flex;align-items:center;gap:10px;padding:.7em 1.1em;background:#0f172a;color:#e2e8f0;font-size:1em}
.vbar .lg{width:1.7em;height:1.7em;border-radius:.45em;background:linear-gradient(135deg,#1a73e8,#14b8a6);display:grid;place-items:center;color:#fff;font-weight:800;font-size:.9em}
.vbar b{color:#fff}.vbar .sp{flex:1}
.mode{display:flex;align-items:center;gap:.5em;background:#ffffff14;border-radius:99px;padding:.3em .8em;font-size:.9em}
.sw{width:2.4em;height:1.3em;border-radius:99px;background:#475569;position:relative;transition:background .3s}
.sw i{position:absolute;top:.15em;left:.15em;width:1em;height:1em;border-radius:50%;background:#fff;transition:left .3s}
.sw.on{background:#16a34a}.sw.on i{left:1.25em}
.live{display:flex;align-items:center;gap:.4em;font-size:.85em;color:#86efac}.live:before{content:"";width:.55em;height:.55em;border-radius:50%;background:#22c55e;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
.vbody{flex:1;display:grid;grid-template-columns:1.25fr 1.05fr .72fr;gap:1em;padding:1em 1.1em .6em;min-height:0;background:#f8fafc}
.panel{background:#fff;border:1px solid var(--line);border-radius:.9em;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.ph{display:flex;align-items:center;gap:.55em;padding:.6em .9em;font-weight:700;font-size:.95em;border-bottom:1px solid var(--line)}
.ph .ic{width:1.5em;height:1.5em;border-radius:.4em;display:grid;place-items:center;color:#fff;font-size:.8em}
.ph small{margin-left:auto;font-weight:500;color:var(--mute);font-size:.82em}
.pb2{padding:1em 1.1em;overflow:hidden;flex:1;min-height:0;font-size:1.12em;line-height:1.5}
.src{animation:srcin .5s ease both}@keyframes srcin{from{opacity:0;transform:translateY(.6em)}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.25em .8em;font-size:.92em}.kv span{color:var(--mute)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.82em;background:#0f172a;color:#e2e8f0;border-radius:.5em;padding:.7em .8em;line-height:1.55;white-space:pre;overflow:hidden}
.code .r{color:#fca5a5}.code .g{color:#86efac}.code .y{color:#fde68a}.code .c{color:#94a3b8}
.tag{display:inline-block;font-size:.78em;font-weight:700;border-radius:.4em;padding:.15em .5em;margin-right:.3em}
.t-red{background:#fee2e2;color:#b91c1c}.t-amb{background:#fef3c7;color:#b45309}.t-grn{background:#dcfce7;color:#15803d}.t-blu{background:#dbeafe;color:#1d4ed8}.t-vio{background:#ede9fe;color:#6d28d9}
.type{overflow:hidden;white-space:nowrap;border-right:2px solid #1a73e8;animation:typing 2.2s steps(40) both, caret .8s step-end infinite;max-width:100%;display:inline-block}
@keyframes typing{from{width:0}to{width:100%}}@keyframes caret{50%{border-color:transparent}}
.bars{display:flex;align-items:flex-end;gap:2px;height:3.6em;margin:.4em 0}.bars i{flex:1;background:#93c5fd;border-radius:2px 2px 0 0}.bars i.hot{background:#f87171}
/* pipeline */
.steps{list-style:none;margin:0;padding:.5em .7em;display:flex;flex-direction:column;gap:.32em;overflow:hidden}
.st{display:flex;align-items:center;gap:.6em;padding:.42em .6em;border-radius:.6em;border:1px solid transparent;transition:all .35s}
.st .d{flex:none;width:1.45em;height:1.45em;border-radius:50%;display:grid;place-items:center;font-size:.75em;font-weight:800;background:#e2e8f0;color:#64748b;transition:all .35s}
.st b{font-size:.95em;font-weight:600;color:#94a3b8;transition:color .35s}.st small{display:block;font-size:.8em;color:#94a3b8;font-weight:400}
.st .who{margin-left:auto;display:flex;gap:.2em}
.av{width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.68em;font-weight:800;box-shadow:0 0 0 2px #fff}
.st.active{background:#eff6ff;border-color:#bfdbfe}.st.active .d{background:#1a73e8;color:#fff;animation:pulse 1.2s infinite}.st.active b{color:var(--ink)}
.st.done .d{background:#16a34a;color:#fff}.st.done b{color:var(--ink2)}
.st.gate{background:#fffbeb;border-color:#fcd34d}.st.gate .d{background:#d97706;color:#fff;animation:pulse 1.2s infinite}.st.gate b{color:#92400e}
.st.fail{background:#fef2f2;border-color:#fecaca}.st.fail .d{background:#dc2626;color:#fff}.st.fail b{color:#991b1b}
@keyframes pulse{0%{box-shadow:0 0 0 0 #1a73e866}70%{box-shadow:0 0 0 .5em #1a73e800}}
/* phone */
.phonewrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:.6em 0;min-height:0}
.phlab{font-size:.75em;letter-spacing:1px;text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:.4em}
.phone{width:13.2em;height:26em;border-radius:2.1em;background:#0b0f17;padding:.55em;box-shadow:0 1em 2em -1em #0f172a88;position:relative;flex:none}
.scr{width:100%;height:100%;border-radius:1.65em;background:#fff;overflow:hidden;position:relative;display:flex;flex-direction:column;font-size:.86em}
.scr .sb{display:flex;justify-content:space-between;padding:.6em 1em .2em;font-size:.75em;font-weight:700}
.scr .ab{display:flex;justify-content:space-between;align-items:center;padding:.4em 1em .5em;border-bottom:1px solid #f1f5f9;font-weight:700}
.scr .ab small{color:#16a34a;font-weight:600;font-size:.8em}
.scr .bd{padding:.7em .9em;flex:1;display:flex;flex-direction:column;gap:.45em;overflow:hidden}
.pf{border:1.5px solid #e2e8f0;border-radius:.6em;padding:.3em .6em;font-size:.92em}.pf span{display:block;font-size:.72em;color:#64748b}
.pf.miss{border-color:#ef4444;background:#fff7f7}.pf.miss span{color:#dc2626}.pf.new{border-color:#22c55e;background:#f0fdf4;animation:srcin .5s ease both}
.pbtn{margin-top:auto;border-radius:.7em;padding:.65em;text-align:center;color:#fff;font-weight:700;font-size:.92em;transition:background .4s}
.banner{border-radius:.6em;padding:.45em .6em;font-size:.8em;background:#fff7ed;color:#c2410c;animation:srcin .4s ease both}
.ptoast{position:absolute;left:.7em;right:.7em;bottom:.8em;background:#1f2937;color:#fff;border-radius:.6em;padding:.55em .7em;font-size:.8em;animation:srcin .35s ease both}
.ptoast.ok{background:#15803d}.ptoast.bad{background:#b91c1c}
.dialog{position:absolute;inset:0;background:#0f172a88;display:grid;place-items:center;animation:srcin .3s ease both}
.dialog div{background:#fff;border-radius:.8em;padding:1em;width:82%;font-size:.86em;box-shadow:0 1em 2em #0005}
.dialog b{display:block;margin-bottom:.4em}.dialog p{margin:0 0 .7em;color:#475569}.dialog i{display:block;text-align:right;color:#1a73e8;font-style:normal;font-weight:700}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:1.2em 1.2em 0 0;box-shadow:0 -0.6em 1.4em #0f172a33;padding:1em;animation:sheet .45s cubic-bezier(.2,.8,.2,1) both;font-size:.88em}
@keyframes sheet{from{transform:translateY(100%)}}
.sheet b{display:block;margin-bottom:.3em}.sheet p{margin:0 0 .6em;color:#475569;font-size:.9em}
.spin{width:2em;height:2em;border:.25em solid #e2e8f0;border-top-color:#1a73e8;border-radius:50%;animation:rot 1s linear infinite;margin:3em auto .6em}@keyframes rot{to{transform:rotate(360deg)}}
/* tools rail */
.rail{display:flex;gap:.35em;flex-wrap:wrap;padding:.5em 1.1em .7em;background:#f8fafc;border-top:1px solid var(--line);align-items:center}
.tl{display:flex;align-items:center;gap:.35em;font-size:.78em;font-weight:600;color:#64748b;background:#fff;border:1px solid var(--line);border-radius:99px;padding:.22em .6em .22em .3em;transition:all .3s}
.tl i{width:1.25em;height:1.25em;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:.75em;font-weight:800}
.tl.hot{color:#0f172a;border-color:currentColor;box-shadow:0 0 0 .2em #1a73e81f;transform:translateY(-2px);background:#eff6ff}
.tl.done{color:#334155}
.ticker{margin-left:auto;font-size:.78em;color:#475569;font-family:ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42%}
.ticker b{color:#16a34a}
/* overview */
.ov{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#13213f,#070b16 70%)}
.ov svg{width:100%;height:100%;display:block}
.ov text{font-family:inherit}
.video.free{aspect-ratio:auto;max-height:none;background:#0b1220}.video.free .stage{position:static}
.cnt-top{display:flex;align-items:center;gap:1.2em;margin-bottom:.8em}
.cnt-num{font-size:3.4em;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:#0f172a;line-height:1}.cnt-num small{font-size:.35em;color:#94a3b8;margin-left:.2em}
.cnt-meta{flex:1}.cnt-meta b{display:block;font-family:ui-monospace,Menlo,monospace;font-size:1em}.cnt-meta span{font-size:.85em;color:#475569}
.cnt-bar{height:.45em;border-radius:99px;background:#e2e8f0;margin-top:.4em;overflow:hidden}.cnt-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#22d3ee);transition:width .08s linear}
.cnt-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:.3em}
.cc{font-family:ui-monospace,Menlo,monospace;font-size:.72em;text-align:center;padding:.3em 0;border-radius:.35em;background:#f1f5f9;color:#94a3b8;transition:background .12s,color .12s,transform .12s}
.cc.pass{background:#dcfce7;color:#15803d}.cc.fail{background:#fee2e2;color:#b91c1c;font-weight:800}.cc.run{background:#1a73e8;color:#fff;transform:scale(1.12)}
@media(max-width:1100px){.app{grid-template-columns:1fr}.nav{display:none}.main{padding:14px}}

/* google meet chapter */
.meet{position:absolute;inset:0;display:flex;flex-direction:column;background:#202124;color:#e8eaed;font-family:"Google Sans",Inter,system-ui,sans-serif}
.mtop{display:flex;align-items:center;gap:.7em;padding:.7em 1.1em;font-size:.95em}.mtop .sp,.mbar .sp{flex:1}
.mlogo{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:1.3em;height:1.3em}.mlogo i{border-radius:2px}
.mrec{color:#f28b82;font-size:.75em;font-weight:700;letter-spacing:.5px}.mtime,.mcode{color:#9aa0a6;font-size:.85em}
.mbody{flex:1;display:grid;grid-template-columns:1fr 17em;gap:.8em;padding:0 1.1em;min-height:0}
.mstage{display:flex;flex-direction:column;gap:.7em;min-height:0}
.mtiles{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:.7em;min-height:0}
.mt{position:relative;border-radius:.9em;overflow:hidden;background:#3c4043;outline:3px solid transparent;transition:outline-color .2s}
.mt img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
.mt.talk{outline-color:#8ab4f8}
.mt-n{position:absolute;left:.7em;bottom:.6em;font-size:.85em;font-weight:600;text-shadow:0 1px 3px #000a;display:flex;align-items:center;gap:.45em}
.mt-ai{background:#7c3aed;border-radius:.4em;padding:.15em .45em;font-size:.8em;text-shadow:none}
.mt-mic{position:absolute;right:.7em;top:.7em;width:1.8em;height:1.8em;border-radius:50%;background:#1a73e8;display:flex;align-items:center;justify-content:center;gap:2px;opacity:0;transition:opacity .2s}
.mt.talk .mt-mic{opacity:1}.mt-mic i{width:3px;height:.4em;background:#fff;border-radius:2px;animation:mbars .6s infinite alternate}
.mt-mic i:nth-child(2){animation-delay:.2s}.mt-mic i:nth-child(3){animation-delay:.4s}
@keyframes mbars{to{height:.95em}}
.mcap{min-height:3.6em;background:#000c;border-radius:.6em;padding:.55em .9em;font-size:1.02em;line-height:1.4}
.mcap b{display:block;font-size:.75em;color:#8ab4f8;margin-bottom:.1em}
.mside{background:#fff;color:#202124;border-radius:.9em;padding:.8em;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.msh{font-weight:700;font-size:.92em;margin-bottom:.6em}.msh small{display:block;font-weight:400;color:#5f6368;font-size:.8em}
.mctx{display:flex;flex-direction:column;gap:.5em}
.mcard{display:flex;gap:.6em;border:1px solid #e8eaed;border-radius:.6em;padding:.5em .6em;font-size:.78em}
.mcard>span{width:.35em;border-radius:.2em;flex:none}.mcard small{display:block;color:#5f6368;font-size:.85em}
.mcard b{display:block;font-size:1em}.mcard em{display:block;font-style:normal;color:#3c4043;font-size:.9em}
.mcard.fresh{animation:mfresh .5s ease-out}@keyframes mfresh{from{opacity:0;transform:translateY(.5em)}}
.mbar{display:flex;align-items:center;justify-content:center;gap:.6em;padding:.7em 1.1em}
.mb{width:2.4em;height:2.4em;border-radius:50%;background:#3c4043;display:grid;place-items:center;font-size:.9em}
.mb.on{background:#8ab4f8;color:#202124;font-weight:700;font-size:.75em}.mb.end{background:#ea4335;width:3.4em;border-radius:1.2em}
.mppl{color:#9aa0a6;font-size:.85em;position:absolute;right:1.1em}
.mended{position:absolute;inset:0;background:#202124f2;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .4s}
.mended.on{opacity:1}.mended div{text-align:center}.mended b{display:block;font-size:1.5em;margin-bottom:.3em}.mended span{color:#9aa0a6}

/* video motion: live-camera feel */
.mt img{animation:cam 9s ease-in-out infinite alternate;transform-origin:50% 35%}
#mt-E img{animation-duration:11s;animation-delay:-3s}
@keyframes cam{0%{transform:scale(1.04) translate(0,0)}50%{transform:scale(1.06) translate(-.6%,.4%)}100%{transform:scale(1.05) translate(.5%,-.3%)}}
.mt.talk img{animation:cam 9s ease-in-out infinite alternate,talk .42s ease-in-out infinite alternate}
@keyframes talk{to{filter:brightness(1.04)}}
.mt.talk .mt-face{animation:nod 1.6s ease-in-out infinite}
.mt::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 60%,#0006);pointer-events:none}
.mt-live{position:absolute;left:.7em;top:.7em;font-size:.7em;font-weight:700;background:#0008;border-radius:.4em;padding:.15em .45em;z-index:2}
.vidwrap{position:absolute;inset:0;background:#000;display:grid;place-items:center}.vidwrap video{width:100%;height:100%;object-fit:contain;display:block}

/* IMAX-style countdown */
.imx{position:absolute;inset:0;background:radial-gradient(60% 70% at 50% 50%,#0b1a33 0%,#000 70%);overflow:hidden;display:grid;place-items:center;color:#fff}
.imx-grain{position:absolute;inset:-50%;background-image:radial-gradient(#ffffff10 1px,transparent 1px);background-size:3px 3px;animation:grain .3s steps(3) infinite;opacity:.6}
@keyframes grain{to{transform:translate(2px,-3px)}}
.imx-rings{position:absolute;height:88%;aspect-ratio:1}
.imx-rings circle{fill:none;stroke:#7dd3fc}.imx-rings .r1{stroke-width:.8;opacity:.9;filter:drop-shadow(0 0 3px #38bdf8)}.imx-rings .r2{stroke-width:.4;opacity:.5}.imx-rings .r3{stroke-width:.3;opacity:.35}
.imx-rings .sw{fill:#38bdf8;opacity:.16}.imx-rings .cr{stroke:#7dd3fc;stroke-width:.25;opacity:.35}
.imx-num{position:relative;font-family:"Inter",system-ui,sans-serif;font-weight:200;font-size:14em;line-height:1;color:#e0f2fe;text-shadow:0 0 .12em #38bdf8,0 0 .4em #0ea5e9aa;font-variant-numeric:tabular-nums}
.imx-flare{position:absolute;left:0;right:0;top:50%;height:2px;background:linear-gradient(90deg,transparent,#bae6fd,#fff,#bae6fd,transparent);box-shadow:0 0 30px 8px #38bdf8;opacity:0}
.imx-title{position:absolute;text-align:center;opacity:0}
.imx-title small{display:block;font-size:.85em;letter-spacing:.5em;color:#7dd3fc;margin-bottom:1em}
.imx-title b{display:block;font-size:6em;font-weight:900;letter-spacing:.06em;line-height:1;background:linear-gradient(180deg,#fff,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 .25em #0ea5e980)}

/* problem → solution */

.ps-arrow{display:grid;place-items:center}.ps-arrow div{width:2.8em;height:2.8em;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.2em;background:linear-gradient(135deg,#38bdf8,#2dd4bf);color:#0b1220;box-shadow:0 0 0 .4em #2dd4bf33,0 0 2em #2dd4bf88}

/* mission control (native) — neutral surfaces, one accent, no glow */

.mc-sb{display:flex;justify-content:space-between;padding:.5em 1em .2em;font-size:.75em;font-weight:600}
.mc-app{padding:.4em .9em}.mc-ab{font-size:.8em;font-weight:700;color:var(--mute);padding-bottom:.4em;border-bottom:1px solid #f0f2f5}
.mc-app h5{margin:.6em 0 .5em;font-size:1.1em}

.mc-who{display:flex;align-items:center;gap:.35em;min-width:0}.mc-who b{display:block;font-size:.78em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mc-who small{display:block;font-size:.62em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mc-who>div{min-width:0}
.mc-av{width:1.7em;height:1.7em;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:.62em;font-weight:700;flex:none}.mc-av.lg{width:2.6em;height:2.6em;font-size:.85em}

14px 12px 10px;font-size:11px}.app h4{margin:6px 0 2px;font-size:14px}.app .hello{font-size:10px;color:#5f6b7c;margin-bottom:7px}\n.banner{border-radius:9px;padding:6px 8px;font-size:9px;line-height:1.35;margin-bottom:6px}\n.field{border:1px solid #d5dbe3;border-radius:8px;padding:4px 8px;margin:5px 0;position:relative}.field label{display:block;font-size:8px;color:#7a8596}.field span{display:block;font-size:10.2px;min-height:13px}\n.field.err{border-color:#d93025}.field .msg{font-size:8px;color:#d93025;margin-top:2px}.field .opt{position:absolute;right:7px;top:5px;font-size:7.4px;color:#7a8596;background:#f1f3f6;border-radius:6px;padding:1px 5px}\n.save{border:0;width:100%;border-radius:11px;padding:8px;font-size:10.5px;font-weight:700;margin-top:8px;color:#fff}\n.diff{outline:2px solid #21b8a6;outline-offset:2px;border-radius:9px;animation:diff 1.4s var(--ease) 2}@keyframes diff{50%{outline-color:rgba(33,184,166,.15);outline-offset:5px}}\n.newpill{position:absolute;right:6px;top:-7px;background:#21b8a6;color:#fff;font-size:7.5px;font-weight:700;padding:1px 6px;border-radius:6px}\n.toast{position:absolute;left:10px;right:10px;bottom:14px;background:#1d2b44;color:#fff;border-radius:10px;padding:7px 9px;font-size:9.6px;animation:up .5s var(--ease)}@keyframes up{from{transform:translateY(16px);opacity:0}}\n.crash{position:absolute;inset:0;background:rgba(15,23,38,.42);display:grid;place-items:center;z-index:2}.crash div{background:#fff;border-radius:14px;width:84%;padding:12px;font-size:10px}.crash b{display:block;font-size:11px;margin-bottom:5px}.crash p{margin:0 0 8px;color:#5f6b7c}.crash span{display:block;text-align:right;color:#1a73e8;font-weight:700;font-size:9.6px}\n.skel{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;gap:9px;padding:50px 12px;z-index:2;transition:opacity .7s var(--ease)}\n.skel i{display:block;height:22px;border-radius:8px;background:linear-gradient(90deg,#eef1f5 0%,#f8f9fb 40%,#eef1f5 80%);background-size:200% 10 k i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--cy2),var(--cy));box-shadow:0 0 10px var(--glow);transition:width .5s var(--ease)}\n.ticks{display:flex;justify-content:space-between;margin-top:7px}.ticks span{width:7px;height:7px;border-radius:50%;background:rgba(148,190,255,.2)}.ticks span.on{background:var(--cy);box-shadow:0 0 6px var(--glow)}\n.stats{display:flex;gap:16px;margin-top:12px;font-size:11px;color:var(--dim)}.stats b{display:block;font-size:18px;color:#fff}\n.legend{position:relative;display:flex;gap:20px;align-items:center;padding:12px 24px;border-top:1px solid var(--gline);font-size:11.5px;color:var(--dim);flex-wrap:wrap}\n.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}.legend .sp{flex:1}\n.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line2)}\n@media (max-width:1200px){.stage{grid-template-columns:1fr;justify-items:center}.flow{width:100%;overflow-x:auto;grid-template-columns:repeat(8,128px)}.links{display:none}.nar{grid-template-columns:1fr}}\n@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}\n<\/style>\n<\/head>\n<body>\n<header class=\"top\"><div class=\"brand\"><span class=\"logo\">m<\/span>MobileHeal <small>MISSION CONTROL \u00b7 DEMO<\/small><\/div><a href=\"/\">\u2190 Back to workspace<\/a><\/header>\n<main class=\"wrap\">\n  <section class=\"hero\">\n    <div><div class=\"eyebrow\">Every actor \u00b7 every tool \u00b7 always in sync<\/div>\n      <h1>One workflow.<span>Every system kept in sync.<\/span><\/h1>\n      <p>Follow one request from signal to production. Agents and people work in one flow, and every tool is synced in both directions: Jira, Figma, GitHub, Zephyr, Confluence, Slack, Datadog and more.<\/p><\/div>\n    <div class=\"note\"><b>Animated vision<\/b>A choreographed demo with simulated connectors. Purple beams read from a tool; teal beams write back to it.<\/div>\n  <\/section>\n  <section class=\"panel\" aria-label=\"Mission control demo\">\n    <div class=\"bar\">\n      <div><div class=\"lbl\">Choose a use case<\/div><div class=\"tabs\" id=\"tabs\" role=\"tablist\"><\/div><\/div>\n      <div class=\"ctl\"><span class=\"live\"><i><\/i>LIVE SYNC<\/span><button class=\"btn primary\" id=\"play\">\u25b6 Play<\/button><button class=\"btn\" id=\"replay\">\u21ba Replay<\/button>\n        <div class=\"speed\" id=\"speed\"><button data-s=\"0.6\">0.5\u00d7<\/button><button data-s=\"1\" class=\"on\">1\u00d7<\/button><button data-s=\"1.6\">2\u00d7<\/button><\/div><\/div>\n    <\/div>\n    <div class=\"stage\" id=\"stage\">\n      <svg class=\"links\" id=\"links\" aria-hidden=\"true\"><\/svg>\n      <div class=\"rail rtop\" id=\"railTop\"><\/div>\n      <div class=\"side before\"><div class=\"cap\">Live today <em>before<\/em><\/div><div class=\"phone\" id=\"pBefore\"><div class=\"screen\"><div class=\"notch\"><\/div><div id=\"sBefore\"><\/div><\/div><\/div><\/div>\n      <div class=\"flow\" id=\"flow\"><\/div>\n      <div class=\"side after\"><div class=\"cap\">After release <em>post change<\/em><\/div><div class=\"phone\" id=\"pAfter\"><div class=\"screen\"><div class=\"notch\"><\/div><div id=\"sAfter\"><\/div><div class=\"skel\" id=\"skel\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><div class=\"lab\" id=\"skelLab\">Waiting for the change\u2026<\/div><\/div><\/div><\/div><\/div>\n      <div class=\"rail bottom\" id=\"railBottom\"><\/div>\n      <div class=\"actors\" id=\"actors\"><\/div>\n      <div class=\"packet\" id=\"packet\"><\/div>\n    <\/div>\n    <div class=\"nar\">\n      <div class=\"now\" id=\"now\"><\/div>\n      <div class=\"log\" id=\"log\" aria-live=\"polite\"><\/div>\n      <div class=\"prog\"><div class=\"row\"><span id=\"stepTxt\">Ready<\/span><span id=\"timeTxt\"><\/span><\/div><div class=\"track\"><i id=\"trackFill\"><\/i><\/div><div class=\"ticks\" id=\"ticks\"><\/div>\n        <div class=\"stats\"><span><b id=\"stSync\">0<\/b>syncs<\/span><span><b id=\"stTools\">0<\/b>tools touched<\/span><span><b id=\"stActors\">0<\/b>actors<\/span><\/div><\/div>\n    <\/div>\n    <div class=\"legend\"><span><i style=\"background:var(--cy)\"><\/i>Work flowing<\/span><span><i style=\"background:var(--vi)\"><\/i>Read from tool<\/span><span><i style=\"background:var(--cy)\"><\/i>Write back to tool<\/span><span><i style=\"background:var(--amb)\"><\/i>Human gate<\/span><span class=\"sp\"><\/span><span>All connectors simulated \u00b7 sample app: MobileHeal Profile<\/span><\/div>\n  <\/section>\n  <div class=\"foot\"><span>Designed for traceable, reviewable change.<\/span><a href=\"/#new\">Create a real change request \u2192<\/a><\/div>\n<\/main>\n<script>\n\"use strict\";\nconst $ = id => document.getElementById(id);\n\nconst TEAM = {PS:[\"Priya Shah\",\"Product Manager\",\"#e37400\"], MC:[\"Maya Chen\",\"UX Designer\",\"#9334e6\"], AM:[\"Arjun Mehta\",\"Android Engineer\",\"#188038\"],\n  EP:[\"Emily Park\",\"iOS Engineer\",\"#d93025\"], DS:[\"Diego Santos\",\"Backend Engineer\",\"#007b83\"], FN:[\"Fatima Noor\",\"QA Lead\",\"#1967d2\"],\n  SR:[\"Sam Rivera\",\"SRE \u00b7 On-call\",\"#c5221f\"], AK:[\"Alex Kim\",\"Release Manager\",\"#5f6368\"], LO:[\"Lena Ortiz\",\"Support Lead\",\"#b06000\"],\n  ND:[\"Narendra Darla\",\"Engineering Manager\",\"#1a73e8\"], AP:[\"Autopilot\",\"AI agent crew\",\"#21b8a6\"]};\nconst ACTORS = [\"ND\",\"PS\",\"MC\",\"AM\",\"EP\",\"DS\",\"FN\",\"SR\",\"AK\",\"LO\",\"AP\"];\n\n/* every tool in the application \u2014 top rail: sources & planning \u00b7 bottom rail: build, verify & operate */\nconst TOOLS = {\n  pega:[\"Pega\",\"P\",\"#0072ce\",\"top\"], email:[\"Email\",\"\u2709\",\"#ea4335\",\"top\"], crashlytics:[\"Crashlytics\",\"\ud83d\udd25\",\"#f57c00\",\"top\"], jira:[\"Jira\",\"\u25c6\",\"#0c66e4\",\"top\"],\n  confluence:[\"Confluence\",\"\u25a4\",\"#1868db\",\"top\"], figma:[\"Figma\",\"F\",\"#a259ff\",\"top\"], amplitude:[\"Amplitude\",\"A\",\"#1e61f0\",\"top\"], appfollow:[\"AppFollow\",\"\u2605\",\"#ff5a5f\",\"top\"],\n  github:[\"GitHub\",\"\u2442\",\"#24292f\",\"bottom\"], agents:[\"AI agents\",\"\u2726\",\"#21b8a6\",\"bottom\"], zephyr:[\"Zephyr\",\"Z\",\"#00a3bf\",\"bottom\"], servicenow:[\"ServiceNow\",\"S\",\"#3d8b3d\",\"bottom\"],\n  slack:[\"Slack\",\"#\",\"#611f69\",\"bottom\"], teams:[\"Teams\",\"T\",\"#5b5fc7\",\"bottom\"], datadog:[\"Datadog\",\"\ud83d\udc36\",\"#632ca6\",\"bottom\"], pagerduty:[\"PagerDuty\",\"\u23f0\",\"#06ac38\",\"bottom\"],\n  stores:[\"App Store \u00b7 Play\",\"\u25b6\",\"#0d96f6\",\"bottom\"],\n};\nconst SIGNAL_TOOL = {cr:\"jira\", crash:\"crashlytics\", email:\"email\", jira:\"jira\", ba:\"pega\"};\n\n/* the 8 columns of the flow (left \u2192 right) */\nconst COLS = [\n  {k:\"signal\", t:\"Signal\", s:\"\", ic:\"\u2197\", phase:\"01 Signal\"},\n  {k:\"intake\", t:\"Intake\", s:\"Classify \u00b7 route owner\", ic:\"\u2261\", phase:\"02 Understand & build\"},\n  {k:\"diag\", t:\"Diagnose\", s:\"Rules \u00b7 root cause\", ic:\"\u2315\"},\n  {k:\"design\", t:\"Design\", s:\"Before / after\", ic:\"\u25a7\"},\n  {k:\"impl\", t:\"Implement\", s:\"Branch \u00b7 code + tests\", ic:\"\u2318\"},\n  {k:\"review\", review:true, phase:\"03 Parallel review\", cards:[{k:\"qa\",t:\"QA\",s:\"Coverage\",ic:\"\u25ce\"},{k:\"sec\",t:\"Security\",s:\"Risk\",ic:\"\u25c7\"},{k:\"cor\",t:\"Correctness\",s:\"Behavior\",ic:\"\u2713\"}]},\n  {k:\"tests\", t:\"Run tests\", s:\"Regression\", ic:\"\u25b7\", phase:\"04 Verify\"},\n  {k:\"ship\", stack:true, cards:[{k:\"approve\",t:\"Approve\",s:\"Production switch\",ic:\"\u2691\",gate:true},{k:\"merge\",t:\"Ship\",s:\"Release \u00b7 monitor\",ic:\"\u2442\"}]},\n];\n\n/* bidirectional syncs each step performs: [tool, \"in\" (read) | \"out\" (write) | \"both\", what happened] */\nfunction syncsFor(step, caseKey){\n  const sig = SIGNAL_TOOL[caseKey];\n  con intake:[\"ND\"], diag:[\"DS\",\"AM\"], design:[\"PS\"], impl:[\"EP\",\"DS\"], review:[\"FN\",\"SR\"], tests:[\"AP\"], approve:[\"ND\"], merge:[\"SR\",\"LO\"]};\nconst CASES = {\n  cr: {tab:\"New change request\", ic:\"\u2197\", sig:[\"Change request\",\"Product owner\"],\n    before:{banner:\"Your profile is missing: Date of Birth\", bannerBg:\"#fff1df\", bannerFg:\"#a5550a\", fields:[[\"Name\",\"Jane Doe\"],[\"Email\",\"jane@example.com\"],[\"Date of birth *\",\"\"],[\"Town\",\"Austin\"]], btn:[\"Save\",\"#6750A4\"], hello:\"Hello Jane \ud83d\udc4b\"},\n    after:{fields:[[\"Name\",\"Jane Doe\"],[\"Email\",\"jane@example.com\"],[\"Date of birth\",\"\",{opt:true,diff:true}],[\"Town\",\"Austin\"]], btn:[\"Save changes\",\"#188038\",true], hello:\"Hello Jane \ud83d\udc4b\", toast:\"Saved \u2014 profile complete\"},\n    steps:[\n      [\"signal\",\"PS\",\"Priya submits a change request\",\"\u201cDate of birth should be optional, the save button green and labelled \u2018Save changes\u2019.\u201d\",2],\n      [\"intake\",\"AP\",\"Classified as a profile-screen change\",\"Owner routed to Product \u00b7 component Mobile (Android + iOS) \u00b7 CR-48 opened.\",1.6],\n      [\"diag\",\"AP\",\"Requirement turned into exact rules\",\"date_of_birth: optional \u00b7 ui.button_color = #188038 \u00b7 ui.button_label = \u201cSave changes\u201d.\",1.8],\n      [\"design\",\"MC\",\"Maya approves the design\",\"Before / after screens and accessibility contrast check pass.\",1.8],\n      [\"impl\",\"AM\",\"Code generated on an isolated branch\",\"Kotlin, SwiftUI and backend rules updated, plus contract tests.\",1.8],\n      [\"review\",\"AP\",\"Three independent reviewers in parallel\",\"QA coverage \u2713 \u00b7 Security \u2713 \u00b7 Correctness \u2713 \u2014 all must pass.\",2.2],\n      [\"tests\",\"FN\",\"Regression runs with test data\",\"42 Zephyr cases passed \u00b7 no tester input needed.\",1.8],\n      [\"approve\",\"AK\",\"Alex flips the production switch\",\"Human-in-the-lo <span><\/span>\").join(\"\") + \"<span><\/span>\";\n  $(\"trackFill\").style.width = \"0%\"; $(\"stepTxt\").textContent = \"Ready \u2014 press Play\"; $(\"timeTxt\").textContent = `0 / ${C.steps.length+1}`;\n  $(\"log\").innerHTML = '<div style=\"color:#8c9bb6\">\u203a waiting for a signal\u2026<\/div>';\n  nSync = 0; toolsHit = new Set(); actorsHit = new Set(); stats();\n  narrate(\"ND\",\"Mission control ready\",\"Press Play to follow this \"+C.tab.toLowerCase()+\" through every actor and tool.\",\"Engineering manager view\");\n  [\"pBefore\",\"pAfter\"].forEach(id=>$(id).classList.remove(\"focus\"));\n  requestAnimationFrame(drawLinks);\n}\nfunction stats(){ $(\"stSync\").textContent = nSync; $(\"stTools\").textContent = toolsHit.size; $(\"stActors\").textContent = actorsHit.size; }\n\n/* geometry */\nfunction pt(el, side){\n  const s = $(\"stage\").getBoundingClientRect(), r = el.getBoundingClientRect();\n  const x = side===\"l\" ? r.left-s.left : side===\"r\" ? r.right-s.left : r.left-s.left+r.width/2;\n  const y = side===\"t\" ? r.top-s.top : side===\"b\" ? r.bottom-s.top : r.top-s.top+r.height/2;\n  return [x, y];\n}\nconst NODES = () => ({before:$(\"pBefore\"), after:$(\"pAfter\"), ...Object.fromEntries([...document.querySelectorAll(\".card\")].map(c=>[c.id.slice(2), c]))});\nconst EDGES = [[\"before\",\"signal\"],[\"signal\",\"intake\"],[\"intake\",\"diag\"],[\"diag\",\"design\"],[\"design\",\"impl\"],[\"impl\",\"qa\"],[\"impl\",\"sec\"],[\"impl\",\"cor\"],[\"qa\",\"tests\"],[\"sec\",\"tests\"],[\"cor\",\"tests\"],[\"tests\",\"approve\"],[\"approve\",\"merge\"],[\"merge\",\"after\"]];\nfunction edgePath(a,b){\n  const n = NODES(); if (!n[a]||!n[b]) return \"\";\n  if (a===\"approve\"&&b===\"merge\"){ const [x1,y1]=pt(n[a],\"b\"), [x2,y2]=pt(n[b],\"t\"); return `M${x1},${y1} L${x2},${y2}`; }\n  const [x1,y1]=pt(n[a],\"r\"), [x2,y2]=pt(n[b],\"l\"), mx=(x1+x2)/2;\n  return Math.abs(y1-y2)<2 ? `M${x1},${y1} L${x2},${y2}` : `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;\n}\nfunction drawLinks(){\n  const s = $(\"stage\").getBoundingClientRect(), L = $(\"links\");\n  L.setAttribute(\"viewBox\",`0 0 ${s.width} ${s.height}`); L.setAttribute(\"width\",s.width); L.setAttribute(\"height\",s.height);\n  const n = NODES(); let loop = \"\";\n  if (n.tests && n.impl){ const [x1,y1]=pt(n.tests,\"b\"), [x2,y2]=pt(n.impl,\"b\"); const low = Math.max(y1,y2)+30; loop = `<path class=\"loop\" d=\"M${x1},${y1} L${x1},${low} L${x2},${low} L${x2},${y2}\"/>`; }\n  L.innerHTML = `<defs><linearGradient id=\"sg\" x1=\"0\" x2=\"1\"><stop offset=\"0\" stop-color=\"#9b8cff\"/><stop offset=\"1\" stop-color=\"#46e3d0\"/><\/linearGradient><\/defs>` + EDGES.map(([a,b])=>`<path id=\"e-${a}-${b}\" d=\"${edgePath(a,b)}\"/>`).join(\"\") + loop + '<g id=\"syncs\"><\/g>';\n}\naddEventListener(\"resize\", ()=>requestAnimationFrame(drawLinks));\n\n/* animation primitives */\nconst ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;\nasync function sleep(ms, token){ let left = ms/speed; while (left>0){ if (token!==run) throw \"stop\"; await new Promise(r=>setTimeout(r,40)); if (!paused) left -= 40; } if (token!==run) throw \"stop\"; }\nfunction travel(pathEl, ms, token, opts={}){\n  return new Promise((res, rej)=>{\n    if (!pathEl) return res();\n    const len = pathEl.getTotalLength(), main = !opts.cls;\n    const p = main ? $(\"packet\") : Object.assign(document.createElement(\"div\"), {className:\"packet \"+opts.cls});\n    if (!main) $(\"stage\").appendChild(p);\n    p.style.opacity = 1; if (main) pathEl.classList.add(\"lit\");\n    let t = 0, last = performance.now(), lt = 0;\n    const tick = now => {\n      if (token!==run){ if(!main) p.remove(); return rej(\"stop\"); }\n      const dt = now-last; last = now; if (!paused) t += dt*speed/ms;\n      const k = Math.min(1,t), q = opts.reverse ? 1-ease(k) : ease(k), P = pathEl.getPointAtLength(q*len);\n      p.style.transform = `translate(${P.x}px,${P.y}px)`;\n      if (main && now-lt>45 && !paused){ lt=now; const tr=document.createElement(\"div\"); tr.className=\"trail\"; tr.style.left=P.x+\"px\"; tr.style.top=P.y+\"px\"; $(\"stage\").appendChild(tr); setTimeout(()=>tr.remove(),700); }\n      if (k<1) requestAnimationFrame(tick); else { if (!main) p.remove(); else p.style.opacity=0; res(); }\n    };\n    requestAnimationFrame(tick);\n  });\n}\nfunction log(dir, tool, text){\n  const arrow = {in:\"\u21e0 read \", out:\"\u21e2 write\", both:\"\u21c4 sync \"}[dir];\n  const d = document.createElement(\"div\"); d.className = dir;\n  d.textContent = `${new Date().toLocaleTimeString([], {hour12:false})}  ${arrow}  ${TOOLS[tool][0].padEnd(11)} ${text}`;\n  $(\"log\").prepend(d); while ($(\"log\").children.length > 6) $(\"log\").lastChild.remove();\n}\n/* a bidirectional sync beam between the active card and a tool on the rails */\nasync function syncBeam(cardKey, tool, dir, text, token){\n  const card = $(\"c-\"+cardKey), chip = $(\"t-\"+tool); if (!card || !chip) return;\n  const top = TOOLS[tool][3]===\"top\";\n  const [x1,y1] = pt(card, top?\"t\":\"b\"), [x2,y2] = pt(chip, top?\"b\":\"t\");\n  const my = (y1+y2)/2, path = document.createElementNS(\"http://www.w3.org/2000/svg\",\"path\");\n  path.setAttribute(\"d\",`M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`); path.setAttribute(\"class\",\"sync\");\n  $(\"syncs\").appendChild(path);\n  chip.classList.add(\"sync\"); $(\"tb-\"+tool).textContent = ({in:\"\u21e0 \",out:\"\u21e2 \",both:\"\u21c4 \"}[dir]) + text;\n  log(dir, tool, text); nSync++; toolsHit.add(tool); $(\"tc-\"+tool).textContent = (+($(\"tc-\"+tool).textContent||0)+1); stats();\n  const ms = 850;\n  const jobs = [];\n  if (dir!==\"out\") jobs.push(travel(path, ms, token, {cls:\"sp\", reverse:true}));       // read: tool \u2192 card (violet)\n  if (dir!==\"in\") jobs.push(travel(path, ms, token, {cls:\"sp out\"}));                 // write: card \u2192 tool (teal)\n  try { await Promise.all(jobs); } finally {\n    setTimeout(()=>{ path.remove(); chip.classList.remove(\"sync\"); }, 900/speed);\n  }\n}\nfunction narrate(who, title, text, label){\n  const P = TEAM[who];\n  $(\"now\").innerHTML = `<span class=\"av fade\" style=\"background:${P[2]}\">${who===\"AP\"?\"\u2726\":who}<\/span><div class=\"fade\"><div class=\"t\">${label || (P[0]+\" \u00b7 \"+P[1])}<\/div><div class=\"h\">${title}<\/div><div class=\"d\">${text}<\/div><\/div>`;\n}\nfunction lightActors(keys){\n  document.querySelectorAll(\".actor\").forEach(a=>a.classList.remove(\"on\"));\n  keys.forEach(k=>{ const a=$(\"a-\"+k); if (a){ a.classList.add(\"on\"); actorsHit.add(k); } }); stats();\n}\nfunction setCard(k, cls, who){\n  const c = $(\"c-\"+k); if (!c) return;\n  c.classList.remove(\"active\",\"done\",\"dim\"); if (cls) c.classList.add(cls);\n  if (who){ const P = TEAM[who], w = c.querySelector(\".who\"); w.style.background = P[2]; w.textContent = who===\"AP\"?\"\u2726\":who; }\n}\nfunction meter(k, ms){ const m = $(\"c-\"+k)?.querySelector(\".meter i\"); if (!m) return; m.style.transition=\"none\"; m.style.width=\"0\"; m.offsetWidth; m.style.transition=`width ${ms/speed}ms linear`; m.style.width=\"100%\"; }\nfunction sparkle(){\n  const s = $(\"stage\").getBoundingClientRect(), r = $(\"pAfter\").getBoundingClientRect(), cx = r.left-s.left+r.width/2, cy = r.top-s.top+r.height/2;\n  const cols = [\"#46e3d0\",\"#9ff6ea\",\"#ffc35a\",\"#9b8cff\",\"#5aa9ff\"];\n  for (let i=0;i<30;i++){ const d=document.createElement(\"div\"); d.className=\"spark\"; const a=Math.random()*Math.PI*2, R=90+Math.random()*100;\n    d.style.left=cx+\"px\"; d.style.top=cy+\"px\"; d.style.background=cols[i%5]; d.style.setProperty(\"--dx\",Math.cos(a)*R+\"px\"); d.style.setProperty(\"--dy\",Math.sin(a)*R+\"px\"); $(\"stage\").appendChild(d); setTimeout(()=>d.remove(),1200); }\n}\nfunction progress(i, n){ $(\"trackFill\").style.width = Math.round(100*i/n)+\"%\"; [...$(\"ticks\").children].forEach((t,k)=>t.classList.toggle(\"on\",k<i)); $(\"timeTxt\").textContent = `${i} / ${n}`; }\n\nasync function runSyncs(stepKey, cardKey, token){\n  for (const [tool, dir, text] of syncsFor(stepKey, cur)){ syncBeam(cardKey, tool, dir, text, token).catch(()=>{}); await sleep(420, token); }\n}\nasync function play(){\n  const token = ++run; playing = true; paused = false; $(\"play\").textContent = \"\u275a\u275a Pause\";\n  build(); await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))); drawLinks();\n  const C = CASES[cur], n = C.steps.length + 1;\n  document.querySelectorAll(\".card\").forEach(c=>c.classList.add(\"dim\"));\n  try {\n    $(\"pBefore\").classList.add(\"focus\"); narrate(\"ND\",\"Live today\",\"This is what customers see right now.\",\"Before the change\"); await sleep(1200, token);\n    let prev = \"before\";\n    for (let i=0;i<C.steps.length;i++){\n      const [k, who, title, text, secs] = C.steps[i];\n      $(\"stepTxt\").textContent = `Step ${i+1} of ${C.steps.length} \u00b7 ${title}`;\n      lightActors([who, ...(PARTICIPANTS[k]||[])]);\n      if (k===\"review\"){\n        await Promise.all([\"qa\",\"sec\",\"cor\"].map((r,j)=>travel($(`e-impl-${r}`), 900, token, j===1?{}:{cls:\"sp out\"})));\n        [\"qa\",\"sec\",\"cor\"].forEach(r=>{ setCard(r,\"active\",who); meter(r, secs*1000); });\n        narrate(who, title, text);\n        await Promise.all([sleep(secs*1000, token), runSyncs(\"review\",\"sec\",token)]);\n        [\"qa\",\"sec\",\"cor\"].forEach(r=>setCard(r,\"done\")); prev = \"review\";\n      } else {\n        if (prev===\"review\") await Promise.all([\"qa\",\"sec\",\"cor\"].map((r,j)=>travel($(`e-${r}-tests`), 900, token, j===1?{}:{cls:\"sp out\"})));\n        else await travel($(`e-${prev}-${k}`), 900, token);\n        if (i===0) $(\"pBefore\").classList.remove(\"focus\");\n        setCard(k,\"active\",who); meter(k, secs*1000); narrate(who, title, text);\n        if (k===\"impl\"||k===\"tests\"||k===\"approve\") $(\"skelLab\").textContent = {impl:\"Building the change\u2026\", tests:\"Testing\u2026\", approve:\"Awaiting approval\u2026\"}[k];\n        const extra = syncsFor(k, cur).length * 420;\n        await Promise.all([sleep(Math.max(secs*1000, extra+600), token), runSyncs(k, k, token)]);\n        setCard(k,\"done\"); prev = k;\n      }\n      progress(i+1, n);\n    }\n    await travel($(\"e-merge-after\"), 1000, token);\n    $(\"skel\").classList.add(\"gone\"); $(\"pAfter\").classList.add(\"focus\"); sparkle(); $(\"sAfter\").innerHTML = phoneHTML(CASES[cur].after);\n    lightActors(ACTORS);\n    narrate(\"ND\",\"Live in production \u2014 every system in sync\",\"Jira closed, Figma marked shipped, Confluence release notes published, monitors green. Highlighted: what changed for customers.\",\"After the release\");\n    $(\"stepTxt\").textContent = \"Complete \u00b7 every gate passed \u00b7 every tool synced\"; progress(n, n);\n  } catch(e){ if (e!==\"stop\") console.error(e); return; }\n  playing = false; $(\"play\").textContent = \"\u25b6 Play again\";\n}\n$(\"play\").onclick = () => { if (!playing){ play(); return; } paused = !paused; $(\"play\").textContent = paused ? \"\u25b6 Resume\" : \"\u275a\u275a Pause\"; };\n$(\"replay\").onclick = () => play();\n$(\"tabs\").onclick = e => { const b = e.target.closest(\".tab\"); if (!b) return; cur = b.dataset.k; run++; playing=false; build(); setTimeout(play, 300); };\n$(\"speed\").onclick = e => { const b = e.target.closest(\"button\"); if (!b) return; speed = +b.dataset.s; [...$(\"speed\").children].forEach(x=>x.classList.toggle(\"on\", x===b)); };\naddEventListener(\"keydown\", e => { if (e.key===\" \" && e.target===document.body){ e.preventDefault(); $(\"play\").click(); } if (e.key===\"ArrowRight\"){ cur = ORDER[(ORDER.indexOf(cur)+1)%ORDER.length]; run++; build(); play(); } });\nbuild();\nif (!matchMedia(\"(prefers-reduced-motion: reduce)\").matches) setTimeout(play, 700);\n<\/script>\n<\/body>\n<\/html>\n";

function stateAt(c, i){
  const s = {steps:{}, ph:{fields:BASE_FIELDS.slice(), btn:["#6750A4","Save"], crash:null, loading:false, banner:null, sheet:null, toast:null}, hitl:false, gateDone:false, tools:new Set(), src:"", log:""};
  for (let k = 0; k <= i; k++){
    const b = c.beats[k][1];
    Object.assign(s.steps, b.st || {});
    if (b.src !== undefined) s.src = b.src;
    if (b.log) s.log = b.log;
    if (b.hitl !== undefined) s.hitl = b.hitl;
    if (b.gateDone) s.gateDone = true;
    (b.tl || []).forEach(t => s.tools.add(t));
    s.ph.toast = null;
    if (b.ph) for (const [key, v] of Object.entries(b.ph)) s.ph[key] = v;
  }
  s.cap = c.beats[i][1].cap; s.hot = c.beats[i][1].tl || [];
  return s;
}

/* ---------- player ---------- */
function load(i, autoplay){
  stopVoice();
  P.ch = Math.max(0, Math.min(CHAPTERS.length-1, i)); P.t = 0; P.beat = -1;
  const c = CHAPTERS[P.ch];
  $("slide").style.background = c.bg || c.color; $("titles").style.background = c.accent;
  $("eyebrow").textContent = c.eyebrow ? c.eyebrow : c.interactive ? "Interactive" : c.n ? `Use case ${c.n}` : "Overview"; $("eyebrow").style.color = c.overview ? "#1a73e8" : "#64748b";
  $("title").textContent = c.title; $("sub").textContent = c.sub;
  $("video").classList.toggle("free", !!c.interactive);
  document.querySelector(".ctrl").style.display = c.interactive ? "none" : "";
  if (c.custom) CUSTOM[c.custom].build(); else if (c.interactive) buildInteractive(); else if (c.meet) buildVid(); else c.overview ? buildOverview() : buildStage(c);
  $("marks").innerHTML = c.starts.slice(1).map(s=>`<div class="mk" style="left:${100*s/c.dur}%"></div>`).join("");
  document.querySelectorAll(".chap").forEach((el,k)=>{ el.classList.toggle("on", k===P.ch); el.setAttribute("aria-current", k===P.ch?"true":"false"); if (k===P.ch) el.scrollIntoView({block:"nearest"}); });
  try { history.replaceState(null, "", "#" + c.id); } catch(_){}
  render(); setPlaying(autoplay !== false);
}
function beatAt(c, t){ let i = 0; while (i < c.starts.length-1 && t >= c.starts[i+1]) i++; return i; }
function render(){
  const c = CHAPTERS[P.ch], i = beatAt(c, P.t), changed = i !== P.beat;
  if (c.interactive) {}
  else if (c.custom) CUSTOM[c.custom].apply(P.t);
  else if (c.meet){}
  else if (c.overview) applyOverview(P.t); else applyStage(c, stateAt(c, i), changed);
  if (changed) _cntK = -1;
  if (c.beats[i][1].counter) runCounter((P.t - c.starts[i]) / c.beats[i][0]);
  if (changed){ const cap = c.beats[i][1].cap; $("cap").outerHTML = `<div class="cap" id="cap"><b>${esc(cap[0])}</b><span>${esc(cap[1])}</span></div>`; P.beat = i; }
  $("tk").textContent = `${typeof c.n==="number"?String(c.n).padStart(2,"0"):c.n} · ${i+1}/${c.beats.length}`;
  const pct = 100*P.t/c.dur; $("fill").style.width = pct+"%"; $("knob").style.left = pct+"%";
  $("time").textContent = `${fmt(P.t)} / ${fmt(c.dur)}`;
  const pb = document.querySelectorAll(".chap .pb i")[P.ch]; if (pb) pb.style.width = pct+"%";
}
function setPlaying(v){ if ("speechSynthesis" in window){ if (!v) stopVoice(); } P.playing = v; const mv = mvid(); if (mv){ if (v) mv.play().catch(()=>{}); else mv.pause(); } $("play").textContent = v ? "❚❚" : "▶"; $("play").setAttribute("aria-label", v ? "Pause" : "Play"); P.last = performance.now(); }
function tick(now){
  const dt = Math.min(.25, (now - P.last)/1000); P.last = now;
  const mv = mvid();
  if (mv){ if (P.playing){ P.t = Math.min(mv.currentTime, CHAPTERS[P.ch].dur - .01); render(); } }
  else if (P.playing && !CHAPTERS[P.ch].interactive){
    const c = CHAPTERS[P.ch]; let nt = P.t + dt * P.speed;
    if (c.meet && VO.on && VO.speaking){ const bi = beatAt(c, P.t), end = c.starts[bi] + c.beats[bi][0] - 0.02; if (nt > end) nt = Math.max(P.t, end); }
    P.t = nt;
    if (P.t >= c.dur){ P.t = c.dur; render();
      if ($("autonext").checked && P.ch < CHAPTERS.length-1){ load(P.ch+1, true); } else setPlaying(false); }
    else render();
  } else if (CHAPTERS[P.ch].overview) applyOverview(P.t);
  requestAnimationFrame(tick);
}
function seek(t){ stopVoice(); const c = CHAPTERS[P.ch]; P.t = Math.max(0, Math.min(c.dur - .01, t)); P.beat = -1; const mv = mvid(); if (mv) mv.currentTime = P.t; render(); }

$("chapters").innerHTML = CHAPTERS.map((c,i)=>`<button class="chap" onclick="load(${i})"><span class="n" style="background:${c.chip?c.chip:c.interactive?"#0f172a;box-shadow:inset 0 0 0 1px #38bdf8":c.overview?"#1a73e8":(c.bg.match(/#[0-9a-f]{6}/i)||["#334155"])[0]}">${c.n||"★"}</span><span style="flex:1;min-width:0"><b>${esc(c.label)}</b><small>${c.interactive?"interactive · 5 use cases":fmt(c.dur)+" · "+(c.overview?"all actors & tools":c.steps.length+" steps")}</small><div class="pb"><i></i></div></span></button>`).join("");
$("play").onclick = () => { if (P.t >= CHAPTERS[P.ch].dur - .02) seek(0); setPlaying(!P.playing); };
$("restart").onclick = () => { seek(0); setPlaying(true); };
$("snd").onclick = () => { VO.on = !VO.on; $("snd").textContent = VO.on ? "🔊" : "🔇"; if (!VO.on) stopVoice(); const mv = mvid(); if (mv) mv.muted = !VO.on; };
$("speed").onclick = () => { P.speed = P.speed === 1 ? 1.5 : P.speed === 1.5 ? 2 : P.speed === 2 ? .75 : 1; $("speed").textContent = P.speed + "×"; };
$("fs").onclick = () => { const el = $("slide"); (document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen?.())?.catch?.(()=>{}); };
const scrub = $("scrub"); let drag = false;
const scrubTo = e => { const r = scrub.getBoundingClientRect(); seek(((e.clientX - r.left)/r.width) * CHAPTERS[P.ch].dur); };
scrub.addEventListener("pointerdown", e => { drag = true; scrub.setPointerCapture(e.pointerId); scrubTo(e); });
scrub.addEventListener("pointermove", e => { if (drag) scrubTo(e); });
scrub.addEventListener("pointerup", () => drag = false);
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === " "){ e.preventDefault(); $("play").click(); }
  else if (e.key === "ArrowRight") seek(P.t + 5); else if (e.key === "ArrowLeft") seek(P.t - 5);
  else if (e.key === "ArrowDown"){ e.preventDefault(); load(P.ch+1); } else if (e.key === "ArrowUp"){ e.preventDefault(); load(P.ch-1); }
});
const start = CHAPTERS.findIndex(c => "#"+c.id === location.hash);
load(start >= 0 ? start : 0, false);
requestAnimationFrame(t => { P.last = t; requestAnimationFrame(tick); });
</script>
